<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Profile | EmailX-Ray</title>
<style>
:root{--panel:#0d2033;--line:#1d3b55;--text:#e8f4ff;--muted:#91a9bd;--blue:#36b8ff;--cyan:#65dcff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#06111f,#0a1c2e 60%,#08243b);color:var(--text);font:15px Arial,sans-serif}
header{min-height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px 6%;background:#081827;gap:15px;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;color:var(--cyan);letter-spacing:1px}nav{display:flex;gap:22px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none}nav a:hover,nav a.active{color:var(--cyan)}
main{max-width:900px;margin:40px auto;padding:0 22px}.heading{margin-bottom:24px}.heading h1{margin:0 0 8px;font-size:30px}.heading p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}.profile-head{display:flex;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1769aa,#36b8ff);font-size:23px;font-weight:800;color:#041321}.profile-head h2{margin:0 0 6px}.profile-head p{margin:0;color:var(--muted);font-size:13px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.field{padding:16px;background:#091a2a;border:1px solid var(--line);border-radius:9px}.label{font-size:12px;color:var(--muted);margin-bottom:8px}.value{font-size:15px;overflow-wrap:anywhere}.message{color:var(--muted);font-size:13px;margin-top:18px}
@media(max-width:650px){.details{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand">✉ EmailX-Ray</div><nav><a href="/dashboard">Dashboard</a><a href="/analyze">Analyze Email</a><a href="/history">History</a><a class="active" href="/profile">Profile</a><a href="#" id="logoutLink">Logout</a></nav></header>
<main>
<div class="heading"><h1>My Profile</h1><p>Account information associated with your EmailX-Ray workspace.</p></div>
<section class="card">
<div class="profile-head"><div class="avatar" id="avatar">U</div><div><h2 id="profileName">Loading profile...</h2><p id="profileEmail">Please wait while your account details load.</p></div></div>
<div class="details">
<div class="field"><div class="label">User ID</div><div class="value" id="userId">—</div></div>
<div class="field"><div class="label">Full Name</div><div class="value" id="nameValue">—</div></div>
<div class="field"><div class="label">Email Address</div><div class="value" id="emailValue">—</div></div>
<div class="field"><div class="label">Account Status</div><div class="value">Authenticated</div></div>
</div><p class="message" id="profileMessage"></p>
</section>
</main>
<script>
const token=localStorage.getItem("access_token");if(!token)window.location.replace("/login");
document.getElementById("logoutLink").addEventListener("click",e=>{e.preventDefault();localStorage.removeItem("access_token");localStorage.removeItem("user");sessionStorage.clear();location.href="/login";});
async function loadProfile(){
 const message=document.getElementById("profileMessage");
 try{
  const response=await fetch("/api/users/profile",{headers:{"Authorization":`Bearer ${token}`}});
  const data=await response.json();
  if(!response.ok){if(response.status===401||response.status===403){localStorage.removeItem("access_token");location.replace("/login");return;}throw new Error(data.detail||"Unable to load profile.");}
  const user=data.user||data;
  const name=user.name||user.username||"User",email=user.email||"";
  document.getElementById("profileName").textContent=name;
  document.getElementById("profileEmail").textContent=email;
  document.getElementById("userId").textContent=user.id??"—";
  document.getElementById("nameValue").textContent=name;
  document.getElementById("emailValue").textContent=email;
  document.getElementById("avatar").textContent=name.split(/\s+/).map(part=>part[0]).join("").slice(0,2).toUpperCase();
  localStorage.setItem("user",JSON.stringify({id:user.id,name,email}));
  message.textContent="Your profile information was loaded successfully.";
 }catch(error){console.error(error);message.textContent=error.message||"Could not connect to the server.";}
}
loadProfile();
</script>
</body></html>
